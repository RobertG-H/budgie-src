# Local development environment. See docs/development.md for the commands.

x-app: &app
  build:
    context: .
    target: development
  volumes:
    - .:/app
    - bundle:/usr/local/bundle
  environment:
    DB_HOST: db

services:
  web:
    <<: *app
    # Google OAuth credentials, copied from .env.example. Optional so the specs run without them.
    env_file:
      - path: .env
        required: false
    ports:
      # Only reachable from this machine, like `bin/rails server` outside Docker.
      - "127.0.0.1:3000:3000"
    # Lets `docker compose attach web` drive the debugger.
    stdin_open: true
    tty: true
    # Keeps pid files out of the bind mount, so a server that didn't shut down
    # cleanly can't block the next boot with a stale tmp/pids/server.pid.
    tmpfs:
      - /app/tmp/pids
    depends_on:
      db:
        condition: service_healthy

  css:
    <<: *app
    command: ./bin/rails tailwindcss:watch
    # The Tailwind watcher exits when stdin closes; a TTY keeps it running.
    tty: true

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # Checks over TCP because the image's first-boot init server only listens on a socket.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs Kamal for the operator, for example `docker compose run --rm kamal deploy -d testing`.
  # See docs/deployment.md. It's the only service with the Docker socket and the SSH agent, and the
  # deploy profile keeps `docker compose up` from starting it.
  kamal:
    build:
      context: .
      target: development
    profiles: [ deploy ]
    entrypoint: [ "/app/bin/docker-entrypoint-dev", "bin/kamal" ]
    # The deploy secrets, which .kamal/secrets* map by name. Optional so the service runs without them.
    env_file:
      - path: .env.kamal
        required: false
      - path: .env.testing
        required: false
      - path: .env.production
        required: false
    environment:
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
      # Docker Desktop's daemon, which builds and pushes the image.
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker Desktop's forward of the Mac's SSH agent, which holds the key the hosts accept.
      - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock
      # The host keys you've already accepted, read-only, so a host whose key has changed is refused.
      - type: bind
        source: ${HOME}/.ssh/known_hosts
        target: /root/.ssh/known_hosts
        read_only: true

volumes:
  bundle:
  postgres:
