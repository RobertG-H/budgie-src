version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
  # The Gemfile pins json below 3, because Rails 8.1.3.1 raises on every cookie read with json 3.
  # Remove this and that pin together once Rails supports json 3.
  - dependency-name: json
    versions: [ ">= 3" ]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
