# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  activemodel:
    attributes:
      # What the filing form calls the month a Deposit counts toward, as the Deposit's own form does.
      budget/filing/draft:
        month: Ready to Assign in
        envelope_id: Envelope

  activerecord:
    models:
      # What a Reallocation is called to a person, such as on the form's button.
      budget/envelope_reallocation: Reallocation
      budget/ready_to_assign_reallocation: Reallocation
      # Rails would call it "Csv format", on the form's button.
      budget/csv_format: CSV format
    attributes:
      # What the form calls the month a Deposit counts toward.
      budget/deposit:
        month: Ready to Assign in
      # An Assignment has one amount, and it's what the month view calls Assigned.
      budget/assignment:
        amount: Assigned
      # A Reallocation is from one envelope to another.
      budget/envelope_reallocation:
        from_envelope: From
        to_envelope: To
      # Its envelope is the form's From.
      budget/ready_to_assign_reallocation:
        envelope: From
      # The sample file is where a format's column count comes from, and what the form asks for.
      budget/csv_format:
        column_count: Sample file
        money_in_value: Direction for money in
      # An Import's CSV format is what the form calls it, and an Account's default is "Default CSV format", not Rails' "Default csv format".
      budget/import:
        csv_format: CSV format
      budget/account:
        default_csv_format: Default CSV format
      # What the Filing rule form calls what a rule does with the bank transactions it fits.
      budget/filing_rule:
        outcome: How to file them
    errors:
      models:
        # A Spend or a Refund with no envelope is told so the way every other missing field is, not with Rails' "must exist".
        budget/spend:
          attributes:
            envelope:
              required: "can't be blank"
        budget/refund:
          attributes:
            envelope:
              required: "can't be blank"
        # A Reallocation with no From or To is told so the same way, which is also what another budget's envelope becomes.
        budget/envelope_reallocation:
          attributes:
            from_envelope:
              required: "can't be blank"
            to_envelope:
              required: "can't be blank"
        budget/ready_to_assign_reallocation:
          attributes:
            envelope:
              required: "can't be blank"
        # An Import with no CSV format, which is also what another budget's becomes when it's looked up in the budget's own.
        budget/import:
          attributes:
            csv_format:
              required: "can't be blank"
            # The whole form's Account, which is also what another budget's becomes when it's looked up in the budget's own.
            account:
              required: "can't be blank"
        # What's shown when an Account with bank transactions is deleted, and when a CSV format that an Import used is.
        budget/account:
          restrict_dependent_destroy:
            has_many: "This account can't be deleted because it has bank transactions."
        budget/csv_format:
          restrict_dependent_destroy:
            has_many: "This CSV format can't be deleted because an Import used it."
        # What's shown when an envelope with records is deleted. The reason is the same whatever the records are.
        budget/envelope:
          restrict_dependent_destroy:
            has_many: "This envelope can't be deleted because it has records."
