production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  start_new_months:
    class: StartNewMonthsJob
    schedule: every hour
  # Splitwise's expenses, into each connected Account. The minute is staggered from the month's start, which runs on the hour.
  sync_bank_connections:
    class: SyncBankConnectionsJob
    schedule: every hour at minute 20
