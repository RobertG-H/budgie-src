# budgie-production, served as budgiebuddie.com. Kamal merges this over config/deploy.yml for -d production.
# Nothing answers on the IP address itself; see docs/cloudflare.md.
# The IP address comes from PRODUCTION_HOST_IP in .env.production

servers:
  web:
    - &ip <%= ENV.fetch("PRODUCTION_HOST_IP") %>

proxy:
  host: &hostname budgiebuddie.com

accessories:
  db:
    host: *ip

env:
  clear:
    APP_HOST: *hostname
    MAILER_FROM: "Budgie <no-reply@budgiebuddie.com>"
