# Kamal deploys Budgie to budgie-testing and budgie-production. See docs/deployment.md.
#
# CI is the normal way this runs: .github/workflows/ci.yml deploys testing on every push to main that
# passes, and .github/workflows/deploy-production.yml deploys production on a manual dispatch. The kamal
# Compose service runs the same commands by hand, for break-glass deploys and operator tasks:
#
#   docker compose run --rm kamal deploy -d testing
#
# This file holds what both destinations share. config/deploy.testing.yml and config/deploy.production.yml
# hold what differs, and Kamal merges one of them over this file.

service: budgie

# ghcr.io/robertg-h/budgie, a private package. Each image is tagged with the commit SHA it was built from.
image: robertg-h/budgie

registry:
  server: ghcr.io
  username: robertg-h
  password:
    - KAMAL_REGISTRY_PASSWORD

# The servers and hostnames are only in the destination files, so every command needs -d.
require_destination: true

ssh:
  user: deploy
  # SSHKit forwards your SSH agent by default. Nothing on a host needs it, and one host could use it
  # to reach the other with your key.
  forward_agent: false

# The hosts are amd64. CI builds natively on its amd64 runners; a break-glass build from an arm64 laptop
# builds under QEMU instead: slow, but it works.
builder:
  arch: amd64
  # A registry cache in GHCR, so a deploy with a warm cache only rebuilds the layers that changed. Kamal
  # prefixes this with the registry server, so it resolves to ghcr.io/robertg-h/budgie-build-cache. The
  # first CI deploy creates the package, and a laptop build shares it too, once docker login has run.
  cache:
    type: registry
    options: mode=max
    image: robertg-h/budgie-build-cache

# Cloudflare terminates TLS, and cloudflared reaches kamal-proxy at http://localhost:80 on each host.
proxy:
  ssl: false
  app_port: 80
  # Pass on the X-Forwarded-For that Cloudflare sets, so request.remote_ip is the real client.
  forward_headers: true
  healthcheck:
    path: /up
  run:
    # Publish the proxy's ports on loopback only. Docker's published ports bypass ufw, so the default,
    # every interface, would make the host answer on its IP address. See docs/cloudflare.md.
    bind_ips:
      - 127.0.0.1

# Secrets are mapped by name in .kamal/secrets-common and .kamal/secrets.<destination>.
env:
  secret:
    - SECRET_KEY_BASE
    - BUDGIE_DATABASE_PASSWORD
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - SMTP_USERNAME
    - SMTP_PASSWORD
  clear:
    # Run the Solid Queue supervisor inside Puma. There's one server per destination, and invites are
    # sent with deliver_now, so the only job is the hourly cleanup.
    SOLID_QUEUE_IN_PUMA: true

    # The db accessory, on Kamal's Docker network.
    DB_HOST: budgie-db

    # Zedmail's SMTP relay, the same for both destinations. 2587 is its STARTTLS port, which the
    # smtp_settings in production.rb expect; its other port, 465, would need implicit TLS. See docs/email.md.
    SMTP_ADDRESS: mail.zedmail.com
    SMTP_PORT: 2587

# PostgreSQL, one per host. There's no published port: only the app needs it, over Kamal's network.
accessories:
  db:
    # Pinned to the major version, like compose.yaml. Rebooting the accessory picks up minor versions.
    image: postgres:18
    env:
      clear:
        POSTGRES_USER: budgie
        POSTGRES_DB: budgie_production
      secret:
        - POSTGRES_PASSWORD:BUDGIE_DATABASE_PASSWORD
    # /home/deploy/budgie-db/data on the host.
    directories:
      - data:/var/lib/postgresql

# Run these as, for example, docker compose run --rm kamal task invite:list -d testing
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  # Interactive, because user:delete and budget:currency ask you to type the email to confirm.
  task: app exec --interactive --reuse "bin/rails"

# Local Active Storage files. Nothing uses Active Storage yet.
volumes:
  - "budgie_storage:/app/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /app/public/assets
